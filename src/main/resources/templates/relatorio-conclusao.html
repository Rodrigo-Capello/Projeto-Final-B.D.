<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/estilo.css">
    <title>Relatórios de satisfação</title>
</head>
<body>
    <header class="cabecalho-conclusao">
        <h1>Taxa de conclusão por categoria e ocasião</h1>
        <a th:href="@{/relatorios}" class="botao-voltar">Voltar</a>
    </header>
    <div class="filtro-conclusao">
        <p>Mostrar apenas grupos com taxa de conclusão abaixo de 60%.</p>
        <form th:action="@{/relatorios/conclusao}" method="get">

            <input th:unless="${abaixoDe60}"
                type="hidden" name="abaixoDe60" value="true">

            <button type="submit"
                    th:text="${abaixoDe60} ? 'Remover filtro' : 'Aplicar filtro'"
                    class="botao-menu">
                Aplicar filtro
            </button>
        </form>
    </div>
    <table class="tabela-relatorio">
        <thead>
            <tr>
                <th>Categoria</th>
                <th>Ocasião</th>
                <th>Enviadas</th>
                <th>Concluídas</th>
                <th>Taxa de conclusão (%)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="taxa : ${taxas}">
                <td th:text="${taxa.categoria()}"></td>
                <td th:text="${taxa.ocasiao()}"></td>
                <td th:text="${taxa.enviadas()}"></td>
                <td th:text="${taxa.concluidas()}"></td>
                <td th:text="${taxa.percentual() == null ? 'Sem avaliações enviadas' : taxa.percentual()}"></td>
            </tr>
        </tbody>
    </table>
    <figure th:if="${!taxas.isEmpty()}">
        <figcaption>Avaliações concluídas e pendentes por grupo</figcaption>

        <div class="grade-roscas">
            <section th:each="taxa : ${taxas}" th:if="${taxa.enviadas() > 0}" class="cartao-rosca">
                <h3 th:text="|${taxa.categoria()} — ${taxa.ocasiao()}|"></h3>

                <div class="rosca-com-percentual">
                    <div class="rosca-conclusao"
                        th:classappend="${taxa.percentual() < 60 ? 'taxa-baixa' : (taxa.percentual() < 80 ? 'taxa-media' : 'taxa-alta')}"
                        th:style="|--percentual: ${taxa.percentual()}%;|">
                        <div class="rosca-centro"></div>
                    </div>

                    <strong class="rosca-percentual" th:text="|${taxa.percentual()}%|"></strong>
                </div>

                <p th:text="|${taxa.concluidas()} de ${taxa.enviadas()} concluídas|"></p>
            </section>
        </div>
    </figure>
</body>
</html>
