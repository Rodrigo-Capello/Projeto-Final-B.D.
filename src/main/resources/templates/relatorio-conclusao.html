<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/estilo.css">
    <title>Relatórios de satisfação</title>
</head>
<body>
    <h1>Relatórios de satisfação</h1>
    <p><a th:href="@{/relatorios}" class="botao-voltar">Voltar ao menu</a></p>

    <h2>Taxa de conclusão por categoria e ocasião</h2>
        <form th:action="@{/relatorios/conclusao}" method="get">
            <p>Mostrar apenas grupos com taxa de conclusão abaixo de 60%.</p>

            <input th:unless="${abaixoDe60}"
                type="hidden" name="abaixoDe60" value="true">

            <button type="submit"
                    th:text="${abaixoDe60} ? 'Remover filtro' : 'Aplicar filtro'">
                Aplicar filtro
            </button>
        </form>
    <table class="tabela-relatorio">
        <thead>
            <tr>
                <th>Categoria</th>
                <th>Ocasião</th>
                <th>Enviadas</th>
                <th>Concluídas</th>
                <th>Taxa de conclusão (%)</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="taxa : ${taxas}">
                <td th:text="${taxa.categoria()}"></td>
                <td th:text="${taxa.ocasiao()}"></td>
                <td th:text="${taxa.enviadas()}"></td>
                <td th:text="${taxa.concluidas()}"></td>
                <td th:text="${taxa.percentual()}"></td>
            </tr>
        </tbody>
    </table>
    <figure th:if="${!taxas.isEmpty()}">
        <figcaption>Avaliações concluídas e pendentes por grupo</figcaption>

        <div class="grade-roscas">
            <section th:each="taxa : ${taxas}" class="cartao-rosca">
                <h3 th:text="|${taxa.categoria()} — ${taxa.ocasiao()}|"></h3>

                <div class="rosca-com-percentual">
                    <div aria-hidden="true"
                        th:style="|width: 8rem; height: 8rem; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(#2563eb 0% ${taxa.percentual()}%, #e5e7eb ${taxa.percentual()}% 100%);|">
                        <div style="width: 5rem; height: 5rem; border-radius: 50%; background: white;"></div>
                    </div>

                    <strong class="rosca-percentual" th:text="|${taxa.percentual()}%|"></strong>
                </div>

                <p th:text="|${taxa.concluidas()} de ${taxa.enviadas()} concluídas|"></p>
            </section>
        </div>
    </figure>
</body>
</html>
