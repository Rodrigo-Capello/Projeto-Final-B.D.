<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/estilo.css">
    <title>Gerar avaliação</title>
</head>
<body>
    <h1 class="titulo-questao">Gerar avaliação</h1>

    <p class="mensagem-cadastro mensagem-erro"
       th:if="${erro}" th:text="${erro}" role="alert"></p>

    <div class="mensagem-cadastro" th:if="${codigoGerado != null}">
        <p role="status">Avaliação gerada</p>

        <div class="acoes-questao">
            <a th:href="@{/avaliacoes/{codigo}(codigo=${codigoGerado})}"
               class="botao-menu">Ir para a avaliação do cliente</a>
            <a th:href="@{/}" class="botao-voltar">Voltar</a>
        </div>
    </div>

    <div class="mensagem-cadastro"
         th:if="${codigoGerado == null and compras.isEmpty()}">
        <p>Nenhuma compra entregue está disponível para avaliação</p>
        <a th:href="@{/}" class="botao-voltar">Voltar</a>
    </div>

    <form class="formulario-cadastro formulario-questao"
          th:if="${codigoGerado == null and !compras.isEmpty()}"
          th:action="@{/avaliacoes/nova}" method="post">
        <label for="idCompra">Compra</label>
        <select id="idCompra" name="idCompra" required>
            <option value="">Selecione a compra</option>
            <option th:each="compra : ${compras}"
                    th:value="${compra.id()}"
                    th:text="|Compra ${compra.id()} — ${compra.categoria()} — ${compra.ocasiao()} — entrega em ${compra.dataEntrega()}|">
            </option>
        </select>

        <div class="acoes-questao">
            <button type="submit" class="botao-menu">Gerar avaliação</button>
            <a th:href="@{/}" class="botao-voltar">Voltar</a>
        </div>
    </form>
</body>
</html>
