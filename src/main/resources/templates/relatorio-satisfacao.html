<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/estilo.css">
    <title>Satisfação por tema e ocasião</title>
</head>
<body>
    <header class="cabecalho-conclusao">
        <h1>Satisfação por tema e ocasião</h1>
        <a th:href="@{/relatorios}" class="botao-voltar">Voltar</a>
    </header>

    <table class="tabela-relatorio">
        <thead>
            <tr>
                <th>Ocasião</th>
                <th>Tema</th>
                <th>Quantidade de notas</th>
                <th>Nota média</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="linha : ${satisfacaoPorTema}">
                <td th:text="${linha.ocasiao()}"></td>
                <td th:text="${linha.tema()}"></td>
                <td th:text="${linha.quantidadeNotas()}"></td>
                <td th:text="${linha.notaMedia()}"></td>
            </tr>
        </tbody>
    </table>

    <figure class="grafico-satisfacao" th:if="${!notasPorTema.isEmpty()}">
        <figcaption>Nota média por tema e ocasião (escala de 0 a 5)</figcaption>

        <div class="grupos-satisfacao">
            <section class="grupo-satisfacao" th:each="grupo : ${notasPorTema}">
                <h3 th:text="${grupo.key}"></h3>

                <div class="barras-satisfacao">
                    <div class="coluna-satisfacao" th:each="linha : ${grupo.value}">
                        <strong th:text="${linha.notaMedia()}"></strong>
                        <div class="trilho-satisfacao">
                            <div class="barra-satisfacao"
                                th:style="|height: ${linha.notaMedia() * 20}%;|"></div>
                        </div>
                        <span th:text="${linha.ocasiao()}"></span>
                    </div>
                </div>
            </section>
        </div>
    </figure>
</body>
</html>
