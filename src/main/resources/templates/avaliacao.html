<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/estilo.css">
    <title>Pesquisa de satisfação</title>
</head>
<body>
    <main class="pagina-avaliacao">
        <h1>Pesquisa de satisfação</h1>

        <p class="mensagem-cadastro" th:if="${enviada}">Obrigado! Sua avaliação foi enviada.</p>

        <p class="mensagem-cadastro" th:if="${perguntas.isEmpty() and enviada != true}">
            Esta avaliação está indisponível.
        </p>

        <p th:if="${erro}" th:text="${erro}"></p>

        <form th:unless="${perguntas.isEmpty()}"
            th:action="@{/avaliacoes/{codigo}(codigo=${codigoAvaliacao})}"
            method="post">
            <fieldset th:each="pergunta : ${perguntas}">
                <legend th:text="${pergunta.enunciado()}"></legend>

                <div class="escala-notas" th:if="${pergunta.tipo() == 'escala'}"
                    th:with="rotulos=${ {'Muito ruim', 'Ruim', 'Regular', 'Bom', 'Muito bom'} }">
                    <label th:each="nota : ${#numbers.sequence(1, 5)}">
                        <span th:text="|${nota} — ${rotulos[nota - 1]}|"></span>
                        <input type="radio"
                            th:name="|resposta_${pergunta.id()}|"
                            th:value="${nota}"
                            required>
                    </label>
                </div>

                <textarea th:if="${pergunta.tipo() == 'texto_livre'}"
                        th:name="|resposta_${pergunta.id()}|"
                        aria-label="Comentário"
                        rows="3">
                </textarea>
            </fieldset>
            <button type="submit" class="botao-menu">Enviar avaliação</button>
        </form>
    </main>
</body>
</html>
